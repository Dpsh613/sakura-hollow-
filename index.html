<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sakura Hollow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="veil">
      <div class="veil-inner">
        <div class="veil-blossom"><span></span><span></span><span></span><span></span><span></span></div>
        <p>waking up the island&hellip;</p>
      </div>
    </div>

    <div id="mark">Sakura <em>Hollow</em><small id="clock">9:12 · Spring</small></div>

    <div id="caption" aria-live="polite"></div>

    <div id="hover" role="tooltip"><b></b><span class="blurb"></span><span class="doing"></span></div>

    <div id="hint">drag to orbit · scroll to zoom · click a creature to say hi · double-click to follow</div>

    <button id="soundgate" aria-label="Turn on sound">
      <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <span>tap for sound</span>
    </button>

    <div id="envbtn-wrap">
      <button id="envbtn" aria-label="World settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" id="envicon"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      </button>
      <div id="envpanel" hidden>
        <div class="row">
          <label>Time of day <output id="timeout">9:12</output></label>
          <input type="range" id="time" min="0" max="24" step="0.05" value="9.2" />
          <label class="toggle"><input type="checkbox" id="autotime" checked /> let time flow</label>
        </div>
        <div class="row">
          <label>Weather</label>
          <div class="chips" id="weather">
            <button data-w="clear" title="Clear">☀️</button>
            <button data-w="breezy" title="Breezy">🍃</button>
            <button data-w="cloudy" title="Cloudy">☁️</button>
            <button data-w="rain" title="Rain">🌧️</button>
            <button data-w="storm" title="Storm">⛈️</button>
            <button data-w="fog" title="Mist">🌫️</button>
            <button data-w="snow" title="Snow">❄️</button>
          </div>
          <label class="toggle"><input type="checkbox" id="autoweather" checked /> changing skies</label>
        </div>
        <div class="row">
          <label>Season</label>
          <div class="chips" id="season">
            <button data-s="0" title="Spring">🌸</button>
            <button data-s="1" title="Summer">🌿</button>
            <button data-s="2" title="Autumn">🍁</button>
            <button data-s="3" title="Winter">⛄</button>
          </div>
          <label class="toggle"><input type="checkbox" id="autoseason" checked /> seasons turn</label>
        </div>
        <div class="row">
          <label>Sound <output id="volout">80%</output></label>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" />
          <div class="toggles">
            <label class="toggle"><input type="checkbox" id="mute" /> mute</label>
            <label class="toggle"><input type="checkbox" id="music" checked /> music box</label>
            <label class="toggle"><input type="checkbox" id="captions" checked /> little stories</label>
          </div>
        </div>
      </div>
    </div>

    <nav id="views" aria-label="Camera views">
      <button data-view="overview" title="The whole island" aria-label="The whole island">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="13" rx="8.5" ry="3.2"/><path d="M5 14.5c1.5 3.5 4.3 5.5 7 5.5s5.5-2 7-5.5"/><path d="M10 11c0-3 1-5.5 2-6.5 1 1 2 3.5 2 6.5"/></svg>
      </button>
      <button data-view="treehouse" title="Treehouse" aria-label="Treehouse">
        <svg viewBox="0 0 24 24"><path d="M4 9.5c3 0 5.5-1.6 8-4.5 2.5 2.9 5 4.5 8 4.5"/><path d="M6 15c2.6 0 4.4-1.2 6-3 1.6 1.8 3.4 3 6 3"/><path d="M8 10.5V14M16 10.5V14M9 16v4M15 16v4"/></svg>
      </button>
      <button data-view="village" title="The meadow & campfire" aria-label="The meadow and campfire">
        <svg viewBox="0 0 24 24"><path d="M12 5c1.8 2.2 3 4 3 6a3 3 0 0 1-6 0c0-2 1.2-3.8 3-6z"/><path d="M5 19l14-3M5 16l14 3"/></svg>
      </button>
      <button data-view="pond" title="Pond & waterfall" aria-label="Pond and waterfall">
        <svg viewBox="0 0 24 24"><ellipse cx="11" cy="15" rx="7.5" ry="3"/><path d="M13.5 13.5c1.2-.8 2.8-.8 4 0"/><path d="M19 6v6M21 8v5"/></svg>
      </button>
      <button data-view="garden" title="Vegetable garden" aria-label="Vegetable garden">
        <svg viewBox="0 0 24 24"><path d="M12 20v-7"/><path d="M12 13c-3 0-5-2-5-5 3 0 5 2 5 5zM12 13c3 0 5-2 5-5-3 0-5 2-5 5z"/><path d="M5 20h14"/></svg>
      </button>
      <button data-view="beneath" title="Beneath the island" aria-label="Beneath the island">
        <svg viewBox="0 0 24 24"><path d="M3.5 8h17"/><path d="M5 8l7 11 7-11"/><path d="M10 12l1 3M14 11l-.5 4"/></svg>
      </button>
      <span class="sep"></span>
      <button id="tour" title="Gentle drift" aria-label="Toggle gentle drift" aria-pressed="false">
        <svg viewBox="0 0 24 24" class="play"><path d="M9 7.5v9l7-4.5z"/></svg>
        <svg viewBox="0 0 24 24" class="pause"><path d="M9.5 7.5v9M14.5 7.5v9"/></svg>
      </button>
    </nav>

    <div id="following"><span></span><button aria-label="Stop following">✕</button></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
